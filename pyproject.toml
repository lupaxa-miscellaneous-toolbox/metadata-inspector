[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "lupaxa-metadata-inspector"
dynamic = ["version"]
description = "Inspect, identify, remove, and verify privacy-sensitive metadata in photographs."
readme = "README.md"
license = { file = "LICENCE" }
requires-python = ">=3.11"

authors = [
  { name = "The Lupaxa Project" }
]

keywords = ["metadata", "exif", "privacy", "images", "photography", "cli"]

dependencies = [
  "Pillow>=12.0,<13.0",
  "defusedxml>=0.7.1",
  "piexif>=1.1.3",
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: English",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Security",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/lupaxa-miscellaneous-toolbox/metadata-inspector"
Repository = "https://github.com/lupaxa-miscellaneous-toolbox/metadata-inspector"
Issues = "https://github.com/lupaxa-miscellaneous-toolbox/metadata-inspector/issues"

[project.scripts]
metadata-inspector = "lupaxa.metadata_inspector.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6.0",
  "mypy>=1.12.0",
  "bump-my-version>=1.2.0",
  "pip-audit>=2.7.0",
]
test = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]
heif = [
  "pillow-heif>=0.18",
]

[tool.hatch.version]
path = "src/lupaxa/metadata_inspector/version.py"

[tool.hatch.build.targets.sdist]
include = [
  "src/**",
  "README.md",
  "LICENCE",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lupaxa"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP", "SIM", "C4", "ISC", "D", "ANN", "PT"]
ignore = [
  "D200", "D201", "D202", "D203", "D204", "D205", "D206", "D207", "D208", "D209", "D210", "D211", "D212",
  "ISC001",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "D", "ANN001", "ANN201"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true
warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
follow_imports = "normal"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra -q --disable-warnings --cov=lupaxa.metadata_inspector --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.coverage.run]
source = ["lupaxa.metadata_inspector"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
